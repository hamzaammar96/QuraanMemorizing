name: mutqin
description: "مُتقِن - تطبيق لتنظيم مراجعة وحفظ القرآن الكريم"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة (بسيطة وواضحة)
  provider: ^6.1.2

  # التخزين المحلي للإعدادات والتقدم
  shared_preferences: ^2.2.3

  # الإشعارات اليومية المجدولة
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # تنسيق الأرقام والتواريخ
  intl: ^0.20.2

  cupertino_icons: ^1.0.6
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/google_logo.svg
